<title>Quick Panel 原型 · 聊天窗式</title>
<!-- PROTOTYPE（#15）：选定的 Quick Panel 方案 B「聊天窗式」。不接真实 API，回答是脚本模拟的。底部的条用来显示状态、触发模拟操作，不属于设计本身。 -->
<style>
/* Layout: 模拟 macOS 26 桌面（菜单栏 + 壁纸 + 背后一个编辑器窗口），Quick Panel 浮在屏幕偏上居中；底部固定一条原型切换条，不属于被评估的设计 */
:root{
  --wall-a:#86b3d6; --wall-b:#30507f; --wall-c:#efc08f; --wall-d:#1f2f52;
  --panel:rgba(249,249,251,.80); --panel-line:rgba(0,0,0,.10);
  --fg:#1d1d1f; --fg-2:#6b6b72; --fg-3:#a3a3aa;
  --fill:rgba(0,0,0,.045); --fill-2:rgba(0,0,0,.085);
  --accent:#0a7cff; --accent-fg:#ffffff; --bubble:rgba(10,124,255,.11);
  --warn:#b8590b; --code:rgba(0,0,0,.05);
  --menubar:rgba(255,255,255,.52); --menubar-fg:#1d1d1f;
  --window:#fbfbfc; --window-fg:#2b2b30; --err:#d6372f;
  --bar:#1c1c1f; --bar-fg:#f4f4f6; --bar-dim:#9a9aa3;
  --shadow:0 28px 80px rgba(8,18,40,.38),0 0 0 .5px rgba(0,0,0,.20);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --wall-a:#2c4a6e; --wall-b:#141f38; --wall-c:#6b4a33; --wall-d:#0b1224;
  --panel:rgba(38,38,44,.78); --panel-line:rgba(255,255,255,.10);
  --fg:#f4f4f6; --fg-2:#a6a6ae; --fg-3:#6c6c74;
  --fill:rgba(255,255,255,.06); --fill-2:rgba(255,255,255,.11);
  --accent:#3d9bff; --accent-fg:#ffffff; --bubble:rgba(61,155,255,.20);
  --warn:#f0a35c; --code:rgba(255,255,255,.07);
  --menubar:rgba(24,24,28,.50); --menubar-fg:#f4f4f6;
  --window:#1e1e22; --window-fg:#d8d8de; --err:#ff6b61;
  --bar:#f4f4f6; --bar-fg:#1c1c1f; --bar-dim:#6b6b72;
  --shadow:0 28px 80px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.14);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --wall-a:#2c4a6e; --wall-b:#141f38; --wall-c:#6b4a33; --wall-d:#0b1224;
  --panel:rgba(38,38,44,.78); --panel-line:rgba(255,255,255,.10);
  --fg:#f4f4f6; --fg-2:#a6a6ae; --fg-3:#6c6c74;
  --fill:rgba(255,255,255,.06); --fill-2:rgba(255,255,255,.11);
  --accent:#3d9bff; --accent-fg:#ffffff; --bubble:rgba(61,155,255,.20);
  --warn:#f0a35c; --code:rgba(255,255,255,.07);
  --menubar:rgba(24,24,28,.50); --menubar-fg:#f4f4f6;
  --window:#1e1e22; --window-fg:#d8d8de; --err:#ff6b61;
  --bar:#f4f4f6; --bar-fg:#1c1c1f; --bar-dim:#6b6b72;
  --shadow:0 28px 80px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.14);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--fg);background:var(--wall-d);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 桌面 ---------- */
.desk{position:relative;min-height:100%;overflow:hidden;
  background:
    radial-gradient(120% 80% at 15% 10%,var(--wall-a) 0%,transparent 55%),
    radial-gradient(90% 70% at 90% 85%,var(--wall-c) 0%,transparent 60%),
    linear-gradient(160deg,var(--wall-b),var(--wall-d));}
.menubar{position:fixed;top:0;left:0;right:0;z-index:30;height:28px;display:flex;align-items:center;gap:18px;
  padding:0 16px;padding-top:env(safe-area-inset-top,0px);font-size:13px;color:var(--menubar-fg);
  background:var(--menubar);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6)}
.menubar .app{font-weight:600}
.menubar .grow{flex:1}
.menubar .m{opacity:.85}
.mb-icon{position:relative;display:grid;place-items:center;width:26px;height:22px;border:0;background:none;border-radius:6px;cursor:pointer}
.mb-icon:hover{background:var(--fill-2)}
.mb-icon svg{width:16px;height:16px}
.mb-icon.busy svg{animation:pulse 1.1s ease-in-out infinite}
.mb-icon .dot{position:absolute;top:2px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 1.5px var(--menubar)}
@keyframes pulse{50%{opacity:.35;transform:scale(.88)}}

.editor{position:absolute;left:6%;top:70px;width:min(560px,calc(100% - 32px));border-radius:14px;background:var(--window);
  color:var(--window-fg);box-shadow:0 18px 50px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.2);overflow:hidden;opacity:.97}
.editor .tb{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;font-size:12px;color:var(--fg-2);border-bottom:.5px solid var(--panel-line)}
.editor .tb i{width:11px;height:11px;border-radius:50%;background:var(--fill-2)}
.editor .tb span{margin-left:10px}
.editor pre{margin:0;padding:14px 16px;font:12px/1.65 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.editor .e{color:var(--err)}
.desk-hint{position:absolute;left:50%;top:22vh;transform:translateX(-50%);padding:9px 16px;border-radius:999px;
  background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow);font-size:13px;color:var(--fg-2);border:0;cursor:pointer;white-space:nowrap}
.desk-hint kbd{font:inherit;color:var(--fg);font-weight:600}

/* ---------- 面板通用 ---------- */
#stage{position:absolute;left:50%;top:16vh;transform:translateX(-50%);width:min(680px,calc(100% - 32px));z-index:10}
.qp{background:var(--panel);backdrop-filter:blur(34px) saturate(1.7);-webkit-backdrop-filter:blur(34px) saturate(1.7);
  border-radius:22px;box-shadow:var(--shadow);color:var(--fg);animation:appear .16s ease-out}
@keyframes appear{from{opacity:0;transform:translateY(-6px) scale(.985)}}
.ic{display:grid;place-items:center;width:30px;height:30px;flex:none;border:0;border-radius:9px;background:none;color:var(--fg-2);cursor:pointer}
.ic:hover{background:var(--fill-2);color:var(--fg)}
.ic svg{width:17px;height:17px}
.ic.on{color:var(--accent)}
.ic.off{color:var(--fg-3);opacity:.55;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:220px;height:26px;padding:0 10px;border:0;border-radius:999px;
  background:var(--fill);color:var(--fg-2);font-size:12px;cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--fill-2);color:var(--fg)}
.chip b{font-weight:500;color:var(--fg);overflow:hidden;text-overflow:ellipsis}
.chip .conn{flex:none}
.send{display:grid;place-items:center;width:30px;height:30px;flex:none;border:0;border-radius:50%;background:var(--accent);color:var(--accent-fg);cursor:pointer}
.send:disabled{background:var(--fill-2);color:var(--fg-3);cursor:default}
.send svg{width:15px;height:15px}
.send.stop{background:var(--fg);color:var(--panel)}
textarea#q{flex:1;min-width:0;resize:none;border:0;outline:0;background:none;color:var(--fg);font:inherit;line-height:1.45;padding:0}
textarea#q::placeholder{color:var(--fg-3)}

.attach{display:flex;flex-wrap:wrap;gap:8px}
.attach:empty{display:none}
.att{position:relative;display:flex;align-items:center;gap:7px;height:46px;max-width:200px;border-radius:10px;background:var(--fill);font-size:12px;color:var(--fg-2)}
.att img{width:46px;height:46px;object-fit:cover;border-radius:10px;display:block}
.att.file{padding:0 12px 0 10px}
.att.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:0;display:grid;place-items:center;
  background:var(--fg);color:var(--panel);font-size:11px;line-height:1;cursor:pointer;opacity:.9}
.att .tag{font:600 10px var(--font);letter-spacing:.04em;color:var(--fg-2);background:var(--fill-2);padding:2px 5px;border-radius:5px}

.msgs{overflow-y:auto;overscroll-behavior:contain}
.msg{font-size:14px;line-height:1.6}
.msg p{margin:0 0 .6em}
.msg p:last-child{margin-bottom:0}
.msg ul{margin:0 0 .6em;padding-left:1.3em}
.msg code{font:12.5px var(--mono);background:var(--code);padding:1px 5px;border-radius:5px}
.msg pre{position:relative;margin:0 0 .6em;padding:10px 12px;border-radius:10px;background:var(--code);overflow-x:auto}
.msg pre code{background:none;padding:0;font-size:12.5px;line-height:1.55}
.msg pre .cp{position:absolute;top:6px;right:6px;border:0;border-radius:6px;padding:2px 7px;font-size:11px;background:var(--fill-2);color:var(--fg-2);cursor:pointer;opacity:0}
.msg pre:hover .cp,.msg pre .cp:focus-visible{opacity:1}
.u-atts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.u-atts img{height:64px;border-radius:8px;display:block}
.u-atts .f{font-size:12px;padding:4px 8px;border-radius:7px;background:var(--fill-2);color:var(--fg-2)}
sup.cite{display:inline-grid;place-items:center;min-width:15px;height:15px;margin:0 1px;padding:0 3px;border-radius:5px;background:var(--fill-2);
  color:var(--fg-2);font-size:10px;font-weight:600;vertical-align:2px;line-height:1;cursor:default}
.search{display:flex;align-items:center;gap:7px;margin-bottom:8px;font-size:12px;color:var(--fg-3)}
.search.live{color:var(--fg-2)}
.spin{width:11px;height:11px;border-radius:50%;border:1.6px solid var(--fill-2);border-top-color:var(--accent);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.dots{display:inline-flex;gap:4px;padding:6px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--fg-3);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25}}
.caret{display:inline-block;width:7px;height:1em;margin-left:1px;vertical-align:-2px;background:var(--accent);border-radius:1px;animation:bl .9s infinite}
.sources{margin:10px 0 0;padding:8px 0 0;border-top:.5px solid var(--panel-line);list-style:none;display:grid;gap:3px;font-size:12px}
.sources li{display:flex;gap:7px;min-width:0}
.sources .n{flex:none;color:var(--fg-3);font-variant-numeric:tabular-nums}
.sources a{color:var(--fg);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sources a:hover{color:var(--accent)}
.sources .h{flex:none;color:var(--fg-3)}
.gsugg{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-3)}
.gsugg span.q{padding:4px 10px;border-radius:999px;border:.5px solid var(--panel-line);background:var(--fill);color:var(--fg-2)}
.intr{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--warn)}
.intr button,.lnk{border:0;background:none;padding:0;color:var(--accent);font-size:12px;cursor:pointer}
.hintline{font-size:11.5px;color:var(--fg-3)}
.hintline kbd{font:inherit;color:var(--fg-2)}
.drop{outline:2px dashed var(--accent);outline-offset:-6px}

/* ---------- 变体 A：Spotlight 式 ---------- */
.va-row{display:flex;align-items:flex-start;gap:8px;padding:14px 14px 14px 12px}
.va-row textarea#q{font-size:19px;padding-top:2px}
.va-row .tools{display:flex;align-items:center;gap:4px;flex:none}
.va .attach{padding:0 16px 12px}
.va-msgs{max-height:calc(68vh - 120px);border-top:.5px solid var(--panel-line);padding:14px 18px 6px;display:grid;gap:16px}
.va-msgs:empty{display:none}
.va .msg.user{color:var(--fg-2);font-size:13px}
.va .msg.user::before{content:"你";display:inline-block;margin-right:8px;font-size:11px;font-weight:600;color:var(--fg-3);letter-spacing:.06em}
.va-foot{display:flex;align-items:center;gap:14px;padding:8px 16px 10px;border-top:.5px solid var(--panel-line)}
.va-foot .grow{flex:1}

/* ---------- 变体 B：聊天窗式 ---------- */
.vb{display:flex;flex-direction:column;height:min(560px,70vh)}
.vb-head{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 12px;border-bottom:.5px solid var(--panel-line)}
.vb-title{flex:1;min-width:0;text-align:center;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vb-head .side{display:flex;gap:2px;flex:none}
.vb-head .chip{max-width:190px}
.vb-msgs{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.vb .msg.user{align-self:flex-end;max-width:80%;background:var(--bubble);padding:8px 12px;border-radius:16px 16px 4px 16px}
.vb .msg.assistant{max-width:94%}
.vb-empty{margin:auto;text-align:center;color:var(--fg-3);font-size:13px;display:grid;gap:10px;justify-items:center}
.vb-empty .big{font-size:17px;color:var(--fg-2);font-weight:500}
.vb-empty .sug{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.vb-comp{margin:0 10px 10px;padding:10px 10px 8px 12px;border-radius:16px;background:var(--fill);display:grid;gap:8px}
.vb-comp textarea#q{font-size:14px}
.vb-tools{display:flex;align-items:center;gap:2px}
.vb-tools .grow{flex:1}
.vb-tools .hintline{margin-right:8px}

/* ---------- 变体 C：命令条 + 回答卡片 ---------- */
.vc{display:grid;gap:10px}
.vc-bar{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 16px;border-radius:999px}
.vc-bar .glyph{color:var(--accent);font-size:15px;flex:none}
.vc-bar textarea#q{font-size:16px;max-height:1.45em;white-space:nowrap;overflow:hidden}
.vc-bar .attach{flex-wrap:nowrap}
.vc-bar .att{height:30px}.vc-bar .att img{width:30px;height:30px;border-radius:8px}
.vc-bar .att.file{padding:0 8px}
.vc-bar .chip{max-width:150px}
.vc-card{padding:14px 18px 10px;border-radius:20px}
.vc-card[hidden]{display:none}
.vc-earlier{display:flex;justify-content:center;margin:-4px 0 10px}
.vc-earlier button{border:0;border-radius:999px;padding:3px 10px;font-size:11.5px;background:var(--fill);color:var(--fg-2);cursor:pointer}
.vc-msgs{max-height:52vh;display:grid;gap:12px}
.vc .msg.user{font-size:13px;color:var(--fg-2);padding-left:10px;border-left:2px solid var(--fill-2)}
.vc-acts{display:flex;align-items:center;gap:14px;margin-top:10px;padding-top:8px;border-top:.5px solid var(--panel-line);opacity:.0;transition:opacity .15s}
.vc-card:hover .vc-acts,.vc-card:focus-within .vc-acts{opacity:1}
.vc-acts .grow{flex:1}

/* ---------- 弹出菜单、提示 ---------- */
#menu{position:fixed;z-index:40;min-width:250px;padding:6px;border-radius:14px;background:var(--panel);backdrop-filter:blur(30px) saturate(1.7);
  -webkit-backdrop-filter:blur(30px) saturate(1.7);box-shadow:var(--shadow);font-size:13px}
#menu .grp{padding:6px 10px 3px;font-size:11px;color:var(--fg-3);letter-spacing:.04em}
#menu button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer}
#menu button:hover{background:var(--accent);color:var(--accent-fg)}
#menu button:hover .cap{color:inherit;border-color:currentColor}
#menu .ck{width:12px;flex:none}
#menu .nm{flex:1}
#menu .cap{font-size:10px;padding:1px 5px;border-radius:5px;border:.5px solid var(--panel-line);color:var(--fg-3)}
#menu .note{padding:6px 10px 4px;font-size:11px;color:var(--fg-3);border-top:.5px solid var(--panel-line);margin-top:4px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:50;max-width:calc(100% - 32px);padding:8px 14px;border-radius:12px;
  background:var(--bar);color:var(--bar-fg);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:appear .15s ease-out}

/* ---------- 原型切换条 ---------- */
.switcher{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  width:max-content;max-width:calc(100% - 32px);padding:8px 10px;border-radius:16px;background:var(--bar);color:var(--bar-fg);
  box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:12.5px;display:grid;gap:6px}
.sw-row{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.sw-row button{border:0;border-radius:8px;padding:4px 9px;background:rgba(127,127,127,.22);color:inherit;cursor:pointer;font-size:12px}
.sw-row .arrow{font-size:15px;line-height:1;padding:3px 10px}
.sw-label{min-width:150px;text-align:center;font-weight:600}
.sw-state{font-size:11.5px;color:var(--bar-dim);text-align:center;font-variant-numeric:tabular-nums}

@media (max-width:560px){
  .menubar .m{display:none}
  .editor{left:16px;top:56px}
  #stage{top:12vh}
  .va-row textarea#q{font-size:17px}
  .chip .conn{display:none}
  .vc-bar{border-radius:20px;flex-wrap:wrap}
  .vb-head .chip{max-width:120px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const VARIANTS={B:'方案 B · 聊天窗式（#15 选定）'};
const MODELS=[
  {conn:'DeepSeek',id:'deepseek-flash',vision:true,search:false},
  {conn:'DeepSeek',id:'deepseek-v4-pro',vision:true,search:false},
  {conn:'Claude',id:'claude-sonnet-5-5',vision:true,search:true},
  {conn:'Gemini',id:'gemini-3-flash',vision:true,search:true,google:true},
];
const DEFAULT_MODEL=0;
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label=m=>`${m.conn} / ${m.id}`;

const ICON={

function makeShot(){
  const c=document.createElement('canvas');c.width=640;c.height=200;const g=c.getContext('2d');
  g.fillStyle='#1e1e22';g.fillRect(0,0,640,200);
  g.font='15px Menlo, monospace';g.fillStyle='#c9c9d1';
  g.fillText('func hotkeyPressed() {',20,40);g.fillText('    panel.makeKeyAndOrderFront(nil)',20,66);
  g.fillStyle='#ff6b61';g.fillText("⛔ Main actor-isolated instance method",20,104);
  g.fillText("   'makeKeyAndOrderFront' cannot be called",20,128);g.fillText('   from outside of the actor',20,152);
  return c.toDataURL('image/png');
}
const SHOT=makeShot();

const S={variant:'B',visible:true,menu:false,expanded:false,attachments:[],unseen:false,stale:false,convo:null,bg:new Set()};

S.convo.title='Swift 6 主线程隔离报错';
S.convo.messages=[
  {role:'user',text:'这个报错怎么修？',atts:[{kind:'image',name:'截屏 2026-10-09 14.30.12.png',url:SHOT}]},
  {role:'assistant',status:'done',searches:[],cites:[],text:
"这是 Swift 6 严格并发检查报的错：`NSPanel` 的方法是 `@MainActor` 隔离的，而 `hotkeyPressed()` 没有标注隔离，编译器不能确定它在主线程上执行。\n\n两种改法：\n- 把这个方法（或整个控制器类）标成 `@MainActor`\n- 或者在方法里切回主线程：\n```swift\nTask { @MainActor in\n    panel.makeKeyAndOrderFront(nil)\n}\n```\nHotkey 回调本来就在主线程上触发，第一种更干净。"}
];

/* ---------- 脚本化回答 ---------- */
const short=q=>q.length>18?q.slice(0,18)+'…':q;
function makeReply(q,m,search){
  if(!search) return {searches:[],cites:[],google:null,text:
`关于「${short(q)}」，可以按这个顺序处理：\n\n- 先确认代码在哪个线程上执行。Swift 6 会把很多以前能编译的写法变成编译错误\n- 和界面相关的类型统一标成 \`@MainActor\`\n- 需要从后台回到主线程时，用：\n\`\`\`swift\nTask { @MainActor in\n    panel.orderOut(nil)\n}\n\`\`\`\n如果还有报错，把完整的报错信息粘贴进来。`};
  return {searches:[short(q),'NSPanel nonactivatingPanel macOS 26'],google:m.google?['NSPanel nonactivatingPanel','SwiftUI TextField focus NSPanel']:null,
    cites:[
      {title:'NSPanel | Apple Developer Documentation',host:'developer.apple.com',url:'https://developer.apple.com/documentation/appkit/nspanel'},
      {title:'sindresorhus/KeyboardShortcuts',host:'github.com',url:'https://github.com/sindresorhus/KeyboardShortcuts'},
      {title:'Focus issues with non-activating panels',host:'forums.swift.org',url:'https://forums.swift.org/'}],
    text:
`\`NSPanel\` 设置 \`.nonactivatingPanel\` 之后，点击它不会激活所在的 app [1]。要让面板里的输入框拿到键盘焦点，需要在子类里把 \`canBecomeKey\` 重写为 \`true\` [1]。\n\n全局快捷键可以用 KeyboardShortcuts 库，它基于 Carbon 的 \`RegisterEventHotKey\`，不需要辅助功能权限 [2]。有人反映在新系统上第一次聚焦不稳定，常见的绕法是显示面板后，在下一个 runloop 再设置焦点 [3]：\n\`\`\`swift\npanel.makeKeyAndOrderFront(nil)\nDispatchQueue.main.async { isFocused = true }\n\`\`\``};
}
const makeTitle=(q,atts)=>q?(q.length>16?q.slice(0,16)+'…':q):(atts.length?'图片提问':'新对话');

/* ---------- Turn ---------- */
async function runTurn(c,q,atts){
  const m=MODELS[c.modelIdx];
  const a={role:'assistant',status:'pending',text:'',searches:[],searching:null,cites:[],google:null};
  c.messages.push(a);c.generating=true;let cancelled=false;c.cancel=()=>{cancelled=true};S.bg.add(c);update();
  const r=makeReply(q,m,c.searchOn&&m.search);
  await sleep(500);
  for(const query of r.searches){ if(cancelled)break; a.status='searching';a.searching=query;update(); await sleep(1300); if(!cancelled)a.searches.push(query); a.searching=null; }
  if(!cancelled){ a.status='streaming';a.cites=r.cites;
    let i=0; while(i<r.text.length&&!cancelled){ i+=2+Math.floor(Math.random()*4); a.text=r.text.slice(0,i); update(); await sleep(26); } }
  a.searching=null; a.status=cancelled?'interrupted':'done'; if(!cancelled)a.google=r.google;
  c.generating=false;c.cancel=null;S.bg.delete(c);
  if(!cancelled&&c.title==='新对话'){ await sleep(300); c.title=makeTitle(q,atts); }
  if(!S.visible&&!cancelled)S.unseen=true;
  S.lastEnd=Date.now(); update();
}
function send(){
  const c=S.convo; if(c.generating)return;
  const el=$('#q'); const q=el.value.trim();
  if(!q&&!S.attachments.length)return;
  const atts=S.attachments; S.attachments=[];
  c.messages.push({role:'user',text:q,atts}); el.value=''; autosize(); S.expanded=false;
  runTurn(c,q,atts);
}
function stop(){ S.convo.cancel?.(); }
function retry(){
  const c=S.convo; if(c.generating)return;
  const last=c.messages[c.messages.length-1]; if(last?.role!=='assistant')return;
  c.messages.pop(); const u=c.messages[c.messages.length-1]; runTurn(c,u.text,u.atts||[]);
}
function newConversation(mi=DEFAULT_MODEL,msg){
  S.convo=newConvo(mi); S.attachments=[]; S.expanded=false; update(); toast(msg||'已开始新对话'); focusQ();
}

/* ---------- 附件 ---------- */
const TEXT_EXT=/\.(txt|md|csv|json|swift|py|js|ts|go|rs|java|c|h|m|sh|ya?ml)$/i;
function addFile(f){
  const m=MODELS[S.convo.modelIdx];
  if(f.type.startsWith('image/')){
    if(!m.vision){toast('当前模型不能接受图片');return}
    S.attachments.push({kind:'image',name:f.name||'粘贴的图片.png',url:URL.createObjectURL(f)});
  } else if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)) S.attachments.push({kind:'pdf',name:f.name});
  else if(f.type.startsWith('text/')||TEXT_EXT.test(f.name)) S.attachments.push({kind:'text',name:f.name});
  else {toast(`不支持这种文件类型：${f.name}`);return}
  update();
}

/* ---------- Markdown（只覆盖原型里用到的语法） ---------- */
function md(src,cites,streaming){
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\[(\d)\]/g,(x,n)=>`<sup class="cite" title="${esc(cites?.[n-1]?.title||'')}">${n}</sup>`);
  let out='',code=null,list=null,para=[];
  const fp=()=>{if(para.length){out+=`<p>${para.map(inline).join('<br>')}</p>`;para=[]}};
  const fl=()=>{if(list){out+=`<ul>${list.map(x=>`<li>${inline(x)}</li>`).join('')}</ul>`;list=null}};
  for(const line of src.split('\n')){
    if(code!==null){ if(line.startsWith('```')){out+=pre(code);code=null} else code.push(line); continue; }
    if(line.startsWith('```')){fp();fl();code=[];continue}
    if(/^- /.test(line)){fp();(list??=[]).push(line.slice(2));continue}
    fl(); if(line.trim()==='')fp(); else para.push(line);
  }
  if(code!==null)out+=pre(code); fp();fl();
  if(streaming) out=out.replace(/(<\/(p|li|code)>)(?!.*<\/(p|li|code)>)/s,'<span class="caret"></span>$1');
  return out;
}
const pre=lines=>`<pre><button class="cp" data-act="copy-code">复制</button><code>${esc(lines.join('\n'))}</code></pre>`;

/* ---------- 渲染片段 ---------- */
function userHTML(m){
  const atts=(m.atts||[]).map(a=>a.kind==='image'?`<img src="${a.url}" alt="${esc(a.name)}">`:`<span class="f">${a.kind==='pdf'?'PDF':'文本'} · ${esc(a.name)}</span>`).join('');
  return `<div class="msg user">${atts?`<div class="u-atts">${atts}</div>`:''}${esc(m.text)}</div>`;
}
function asstHTML(m,isLast){
  let h='';
  if(m.searching) h+=`<div class="search live"><span class="spin"></span>正在搜索：${esc(m.searching)}</div>`;
  else if(m.searches.length) h+=`<div class="search">搜索了：${m.searches.map(esc).join('、')}</div>`;
  if(m.status==='pending'||(m.status==='searching'&&!m.text)) h+= m.searching?'':'<div class="dots"><i></i><i></i><i></i></div>';
  if(m.text) h+=md(m.text,m.cites,m.status==='streaming');
  if(m.status==='done'&&m.cites.length&&/\[\d\]/.test(m.text))
    h+=`<ol class="sources">${m.cites.map((c,i)=>`<li><span class="n">${i+1}</span><a href="${c.url}" target="_blank" rel="noopener">${esc(c.title)}</a><span class="h">${c.host}</span></li>`).join('')}</ol>`;
  if(m.google) h+=`<div class="gsugg" title="Gemini 条款要求原样展示 Google 的搜索建议组件（实际是一段 HTML，这里用占位样式代替）">Google 搜索建议 ${m.google.map(q=>`<span class="q">${esc(q)}</span>`).join('')}</div>`;
  if(m.status==='interrupted') h+=`<div class="intr">已中断${isLast?'<button data-act="retry">重试</button>':''}</div>`;
  return `<div class="msg assistant">${h}</div>`;
}
function msgsHTML(list){
  return list.map((m,i)=>m.role==='user'?userHTML(m):asstHTML(m,i===list.length-1)).join('');
}
function attachHTML(){
  return S.attachments.map((a,i)=>a.kind==='image'
    ?`<div class="att"><img src="${a.url}" alt="${esc(a.name)}"><button class="x" data-act="rm-att" data-i="${i}" aria-label="移除">×</button></div>`
    :`<div class="att file"><span class="tag">${a.kind==='pdf'?'PDF':'TXT'}</span><span>${esc(a.name)}</span><button class="x" data-act="rm-att" data-i="${i}" aria-label="移除">×</button></div>`).join('');
}
function modelChip(){

/* ---------- 三个变体的骨架 ---------- */
const SHELL={
B:()=>`<div class="qp vb" id="panel">
  <div class="vb-head">
    <span id="model-slot"></span>
    <div class="vb-title" id="title"></div>
    <div class="side"><button class="ic" data-act="new" title="新对话 ⌘N">${ICON.newc}</button><button class="ic" data-act="open-main" title="在主窗口中打开">${ICON.win}</button></div>
  </div>
  <div class="msgs vb-msgs" id="msgs"></div>
  <div class="vb-comp">
    <div class="attach" id="attach"></div>
    <textarea id="q" rows="1" placeholder="问点什么，或直接粘贴截图…"></textarea>
    <div class="vb-tools">
      <button class="ic" data-act="plus" title="添加文件">${ICON.plus}</button><span id="globe-slot"></span>
      <span class="grow"></span><span class="hintline"><kbd>⏎</kbd> 发送 · <kbd>⇧⏎</kbd> 换行</span><span id="send-slot"></span>
    </div>
  </div>
</div>`};

function renderShell(){
  const draft=$('#q')?.value||'';
  $('#stage').innerHTML=SHELL[S.variant]();
  $('#q').value=draft; autosize(); update(); focusQ();
}

function update(){
  const c=S.convo;
  $('#stage').hidden=!S.visible; $('#deskhint').hidden=S.visible;
  const box=$('#msgs');
  if(box){
    const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<48;
    let list=c.messages;
    if(S.variant==='C'){
      const lastUser=list.map(m=>m.role).lastIndexOf('user');
      const earlier=lastUser>0?lastUser:0;
      $('#earlier').innerHTML=earlier&&!S.expanded?`<button data-act="expand">之前还有 ${earlier} 条消息</button>`:(earlier?`<button data-act="expand">收起之前的消息</button>`:'');
      if(!S.expanded&&lastUser>0) list=list.slice(lastUser);
      $('#card').hidden=!c.messages.length;
    }
    if(S.variant==='B'&&!list.length){
      box.innerHTML=`<div class="vb-empty"><div class="big">有什么想问的？</div><div>可以直接粘贴截图，或者把文件拖进来</div></div>`;
    } else box.innerHTML=msgsHTML(list);
    if(atBottom||c.generating) box.scrollTop=box.scrollHeight;
  }
  const at=$('#attach'); if(at) at.innerHTML=attachHTML();
  const ms=$('#model-slot'); if(ms) ms.innerHTML=modelChip();
  const gs=$('#globe-slot'); if(gs) gs.innerHTML=globeBtn();
  const ss=$('#send-slot'); if(ss) ss.innerHTML=sendBtn();
  const t=$('#title'); if(t) t.textContent=c.title;
  if(S.variant==='A'){ const f=$('#foot'); if(f) f.hidden=!c.messages.length; }
  // 菜单栏图标
  const busy=[...S.bg].some(x=>x.generating);
  $('#mbicon').classList.toggle('busy',busy);
  $('#mbicon').innerHTML=$('#mbicon').innerHTML.replace(/<span class="dot"><\/span>/,'')+(S.unseen?'<span class="dot"></span>':'');
  renderMenu();
  // 切换条
  $('#swlabel').textContent=`${S.variant} · ${VARIANTS[S.variant]}`;
  const st=c.generating?(c.messages.at(-1)?.status==='searching'?'搜索中':'生成中'):'空闲';
  $('#swstate').textContent=`面板${S.visible?'显示':'隐藏'} · Conversation #${c.id} · ${label(MODELS[c.modelIdx])} · ${c.messages.length} 条消息 · ${st}${S.unseen?' · 有未读回答':''}`;
}

function renderMenu(){
  const menu=$('#menu');
  if(!S.menu||!S.visible){menu.hidden=true;return}
  const cur=S.convo.modelIdx,hasMsgs=S.convo.messages.length>0;
  let h='',last='';
  MODELS.forEach((m,i)=>{
    if(m.conn!==last){h+=`<div class="grp">${m.conn}</div>`;last=m.conn}
    h+=`<button data-act="pick-model" data-i="${i}"><span class="ck">${i===cur?'✓':''}</span><span class="nm">${m.id}</span>${m.vision?'<span class="cap">图片</span>':''}${m.search?'<span class="cap">联网</span>':''}</button>`;
  });
  if(hasMsgs) h+=`<div class="note">当前对话已有消息，选择其他模型会开始新对话</div>`;
  menu.innerHTML=h; menu.hidden=false;
  const b=$('#model-btn')?.getBoundingClientRect(); if(!b)return;
  const w=menu.offsetWidth; let left=Math.min(b.left,innerWidth-w-16); left=Math.max(16,left);
  menu.style.left=left+'px'; menu.style.top=(b.bottom+6)+'px';
}

/* ---------- 显示 / 隐藏 ---------- */
function show(){
  const c=S.convo;
  if(S.stale&&!c.generating&&c.messages.length){ S.convo=newConvo(DEFAULT_MODEL); S.attachments=[]; S.expanded=false; setTimeout(()=>toast('距上次回答已超过 10 分钟，已开始新对话'),50); }
  S.stale=false; S.visible=true; S.unseen=false; renderShell();
}
function hide(){ S.visible=false; S.menu=false; update(); }
function focusQ(){ requestAnimationFrame(()=>$('#q')?.focus()); }
function autosize(){ const q=$('#q'); if(!q)return; if(S.variant==='C'){q.style.height='';return} q.style.height='auto'; q.style.height=Math.min(q.scrollHeight,22*6)+'px'; }

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2400); }

function setVariant(v){ S.variant=v; S.menu=false; try{history.replaceState(null,'','#'+v)}catch(e){} if(S.visible)renderShell(); else update(); }
function cycle(d){ const keys=Object.keys(VARIANTS); setVariant(keys[(keys.indexOf(S.variant)+d+keys.length)%keys.length]); }

/* ---------- 事件 ---------- */
function act(a,el,e){
  const c=S.convo;
  switch(a){
    case 'plus': $('#file').click(); break;
    case 'globe': { const m=MODELS[c.modelIdx]; if(!m.search){toast('当前模型不支持联网');break} c.searchOn=!c.searchOn; toast(c.searchOn?'这个对话已开启联网搜索':'这个对话已关闭联网搜索'); update(); break; }
    case 'model': S.menu=!S.menu; update(); break;
    case 'pick-model': { const i=+el.dataset.i; S.menu=false;
      if(i===c.modelIdx){update();break}
      if(c.messages.length) newConversation(i,`已用 ${label(MODELS[i])} 开始新对话`);
      else { c.modelIdx=i; update(); focusQ(); } break; }
    case 'send': send(); break;
    case 'stop': stop(); break;
    case 'retry': retry(); break;
    case 'new': newConversation(); break;
    case 'open-main': toast('会在 Main Window 中打开这个对话（原型里不实现）'); break;
    case 'rm-att': S.attachments.splice(+el.dataset.i,1); update(); focusQ(); break;
    case 'expand': S.expanded=!S.expanded; update(); break;
    case 'copy-code': copy(el.nextElementSibling.textContent); break;
    case 'copy-last': { const m=[...c.messages].reverse().find(x=>x.role==='assistant'); if(m)copy(m.text); break; }
    case 'toggle': S.visible?hide():show(); break;
    case 'show': show(); break;
    case 'prev': cycle(-1); break;
    case 'next': cycle(1); break;
    case 'sim-paste': if(!S.visible)show(); S.attachments.push({kind:'image',name:'粘贴的截图.png',url:SHOT}); update(); focusQ(); break;
    case 'sim-stale': if(c.generating){toast('后台还在生成时，唤起会接着这个对话，不受 10 分钟规则影响');break}
      hide(); S.stale=true; setTimeout(show,700); break;
  }
}
function copy(text){
  navigator.clipboard?.writeText(text).then(()=>toast('已复制'),()=>toast('浏览器不允许复制，请手动选择文本'));
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(t){e.preventDefault();act(t.dataset.act,t,e);return}
  if(e.target.closest('a'))return;
  if(S.menu&&!e.target.closest('#menu')){S.menu=false;update();if(e.target.closest('#stage'))return}
  if(S.visible&&!e.target.closest('#stage,#menu,.switcher,.menubar,.toast')) hide();   // 失焦：点面板外面就隐藏
});
document.addEventListener('keydown',e=>{
  const inField=e.target.matches?.('input,textarea,[contenteditable]');
  if(e.altKey&&e.code==='Space'){e.preventDefault();S.visible?hide():show();return}
  if(!inField&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){cycle(e.key==='ArrowLeft'?-1:1);return}
  if(!S.visible)return;
  if(e.key==='Escape'){e.preventDefault(); if(S.menu){S.menu=false;update()} else hide(); return}
  if((e.metaKey||e.ctrlKey)&&e.key==='.'){e.preventDefault();stop();return}
  if((e.metaKey||e.ctrlKey)&&(e.key==='n'||e.key==='N')){e.preventDefault();newConversation();return}
  if(e.target.id==='q'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}
});
document.addEventListener('input',e=>{ if(e.target.id==='q')autosize() });
document.addEventListener('paste',e=>{
  if(!S.visible)return;
  const files=[...(e.clipboardData?.files||[])];
  if(files.length){e.preventDefault();files.forEach(addFile);focusQ()}
});

document.addEventListener('dragover',e=>{ if(!S.visible)return; e.preventDefault(); $('#panel')?.classList.add('drop') });
document.addEventListener('dragleave',e=>{ if(e.relatedTarget===null)$('#panel')?.classList.remove('drop') });
document.addEventListener('drop',e=>{ if(!S.visible)return; e.preventDefault(); $('#panel')?.classList.remove('drop'); [...(e.dataTransfer?.files||[])].forEach(addFile) });
addEventListener('resize',()=>{ if(S.menu)renderMenu() });

const h=(location.hash||'').slice(1).toUpperCase();
if(VARIANTS[h])S.variant=h;
renderShell();
</script>
